server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: mobile-performance-monitor
  # 使用MySQL数据库
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mobile_apm?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:db/V1__Create_tables.sql
      data-locations: classpath:db/V1.0.2__Insert_Admin_User.sql

# MyBatis-Flex配置
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

# 日志配置
logging:
  level:
    com.monitor: debug
    org.springframework.security: info
    org.springframework.security.web: info
    org.springframework.data.redis.connection: warn
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# JWT配置（密钥从环境变量 JWT_SECRET 注入，无默认值）
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时
  refresh-expiration: 604800000  # 7天

# DeepSeek AI 配置（密钥从环境变量 DEEPSEEK_API_KEY 注入；未配置时 AI 功能降级）
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  api-url: https://api.deepseek.com/chat/completions
  model: deepseek-chat

# API文档配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    group-configs:
    - group: default
      paths-to-match: /**
knife4j:
  enable: true
  setting:
    language: zh-CN
