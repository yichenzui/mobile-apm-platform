server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 200
      min-spare: 10

spring:
  profiles:
    active: dev
  application:
    name: mobile-performance-monitor
  # 自动加载项目根目录的 .env（KEY=VALUE 格式），使敏感配置不再依赖启动脚本注入。
  # optional: 表示文件缺失时不报错；显式指定 [.properties] 是因为 .env 无扩展名。
  # 两个路径分别覆盖「工作目录=backend/」和「工作目录=项目根」两种运行方式。
  # 优先级：操作系统环境变量 > .env，因此 start_all.bat 注入的值仍然优先生效。
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mobile_apm?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  data:
    redis:
      enabled: true
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis-Flex配置
mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml
  mapper-packages: com.monitor.dao, com.monitor.repository
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

# 日志配置
logging:
  level:
    com.monitor: debug
    org.springframework.security: debug
    com.alibaba.druid: warn
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/monitor.log
    max-size: 10MB
    max-history: 30

# JWT配置（密钥从环境变量 JWT_SECRET 注入，不再内置任何默认值）
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时
  refresh-expiration: 604800000  # 7天

# DeepSeek AI 配置（密钥从环境变量 DEEPSEEK_API_KEY 注入；未配置时 AI 功能返回降级提示）
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  api-url: https://api.deepseek.com/chat/completions
  model: deepseek-chat

# API文档配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: default
      paths-to-match: /**
knife4j:
  enable: true
  setting:
    language: zh-CN

# 演示数据自动生成开关（作用于 DemoDataInitializer）
# true  = 每次启动清空并重建 app_key='test-app' 的演示数据（开发 / 演示环境使用）
# false = 不生成演示数据（生产环境务必设为 false，否则每次重启都会删数据）
demo:
  data:
    enabled: true
